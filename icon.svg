<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#3d8be8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Clock ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="16" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="16" stroke-dasharray="755 1005" stroke-linecap="round" transform="rotate(-90 256 256)"/>
  <!-- Clock center dot -->
  <circle cx="256" cy="256" r="12" fill="#4a9eff"/>
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#4a9eff" stroke-width="12" stroke-linecap="round" transform="rotate(60 256 256)"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="#60b0ff" stroke-width="8" stroke-linecap="round" transform="rotate(210 256 256)"/>
  <!-- Hour markers -->
  <circle cx="256" cy="116" r="6" fill="#4a9eff" opacity="0.6"/>
  <circle cx="376" cy="256" r="6" fill="#4a9eff" opacity="0.6"/>
  <circle cx="256" cy="396" r="6" fill="#4a9eff" opacity="0.6"/>
  <circle cx="136" cy="256" r="6" fill="#4a9eff" opacity="0.6"/>
</svg>
